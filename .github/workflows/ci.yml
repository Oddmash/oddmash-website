name: Website checks
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: Oddmash/.github/.github/workflows/ci-scope.yml@9a2077a4b0ff9188ef2cb2ab306f181a134d3110
    with:
      profile: meta
  website-tests:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-browser-captures
          path: test-results/
          retention-days: 7

  verify:
    needs: [scope, website-tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require metadata and website checks
        env:
          SCOPE: ${{ needs.scope.result }}
          WEBSITE: ${{ needs.website-tests.result }}
        run: test "$SCOPE:$WEBSITE" = success:success
